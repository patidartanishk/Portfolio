<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#eduBg)"/>

  <!-- Background decorative playful shapes -->
  <circle cx="1080" cy="180" r="180" fill="rgba(16, 185, 129, 0.1)"/>
  <circle cx="150" cy="520" r="140" fill="rgba(245, 158, 11, 0.08)"/>

  <!-- Left Information Panel -->
  <g transform="translate(80, 100)">
    <rect width="520" height="475" rx="16" fill="rgba(2, 44, 34, 0.88)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

    <!-- Category Pill -->
    <rect x="40" y="45" width="190" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="56" y="66" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">EDUCATION &amp; EARLY YEARS</text>

    <!-- Title -->
    <text x="40" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">Preschool Discovery</text>
    <text x="40" y="170" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Learning Portal</text>

    <!-- Description -->
    <text x="40" y="215" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      Playful, responsive early-childhood education platform with
    </text>
    <text x="40" y="240" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      child learning journeys, interactive curriculum &amp; testimonials.
    </text>

    <!-- Highlights -->
    <g transform="translate(40, 275)">
      <rect width="210" height="85" rx="8" fill="rgba(6, 78, 59, 0.7)" stroke="#047857"/>
      <text x="18" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CURRICULUM PILLARS</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Early Discovery</text>
      <text x="18" y="73" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Creative &amp; Sensory Play</text>

      <rect x="230" y="0" width="210" height="85" rx="8" fill="rgba(6, 78, 59, 0.7)" stroke="#047857"/>
      <text x="248" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PARENT FEEDBACK</text>
      <text x="248" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Community Trust</text>
      <text x="248" y="73" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Verified Testimonials</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(40, 395)">
      <rect x="0" y="0" width="75" height="28" rx="6" fill="#064e3b"/>
      <text x="12" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Next.js</text>

      <rect x="85" y="0" width="85" height="28" rx="6" fill="#064e3b"/>
      <text x="97" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">React.js</text>

      <rect x="180" y="0" width="105" height="28" rx="6" fill="#064e3b"/>
      <text x="192" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tailwind CSS</text>

      <rect x="295" y="0" width="125" height="28" rx="6" fill="#064e3b"/>
      <text x="307" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Child Journey UI</text>
    </g>
  </g>

  <!-- Right Visual: Educational Mockup Frame -->
  <g transform="translate(650, 100)">
    <rect width="470" height="475" rx="16" fill="#022c22" stroke="#047857" stroke-width="1.5"/>
    <rect width="470" height="42" rx="16" fill="#064e3b"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    <text x="235" y="26" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">brightstarts-preschool.edu</text>

    <!-- Learning Card 1 -->
    <g transform="translate(30, 65)">
      <rect width="190" height="175" rx="10" fill="#064e3b" stroke="#059669"/>
      <!-- Sun icon -->
      <circle cx="95" cy="55" r="24" fill="#fbbf24"/>
      <text x="95" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Nursery Roots</text>
      <text x="95" y="135" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Ages 2 - 3 Years</text>
    </g>

    <!-- Learning Card 2 -->
    <g transform="translate(250, 65)">
      <rect width="190" height="175" rx="10" fill="#064e3b" stroke="#059669"/>
      <!-- Book/star icon -->
      <polygon points="95,30 102,48 122,48 106,60 112,78 95,66 78,78 84,60 68,48 88,48" fill="#38bdf8"/>
      <text x="95" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Junior Scholars</text>
      <text x="95" y="135" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Ages 4 - 5 Years</text>
    </g>

    <!-- Parent Reviews Section -->
    <g transform="translate(30, 265)">
      <rect width="410" height="175" rx="10" fill="#064e3b" stroke="#047857"/>
      <text x="25" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">What Parents Experience</text>
      <text x="25" y="65" fill="#fef08a" font-family="system-ui, sans-serif" font-size="14">★★★★★</text>
      <text x="25" y="90" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">"Exceptional atmosphere and dedicated mentors."</text>
      <text x="25" y="112" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">"Interactive curriculum made transition effortless."</text>
      <text x="25" y="145" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">— Verified Parent Community</text>
    </g>
  </g>
</svg>
