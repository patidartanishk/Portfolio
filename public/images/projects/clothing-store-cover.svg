<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="clothBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#clothBg)"/>

  <!-- Subtle circles/shapes in background -->
  <circle cx="1050" cy="150" r="180" fill="rgba(245, 158, 11, 0.08)"/>
  <circle cx="150" cy="550" r="140" fill="rgba(245, 158, 11, 0.05)"/>

  <!-- Left Hero Presentation Card -->
  <g transform="translate(80, 100)">
    <rect width="520" height="475" rx="16" fill="rgba(24, 24, 27, 0.9)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>

    <!-- Category Pill -->
    <rect x="40" y="45" width="150" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="56" y="66" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">E-COMMERCE UI</text>

    <!-- Title -->
    <text x="40" y="135" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="40" font-weight="800">Boutique Clothing</text>
    <text x="40" y="175" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="28" font-weight="600">Store Platform</text>

    <!-- Description -->
    <text x="40" y="225" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      Modern responsive clothing showcase with dynamic catalog,
    </text>
    <text x="40" y="250" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      seamless visual presentation &amp; real-time content management.
    </text>

    <!-- Highlights -->
    <g transform="translate(40, 285)">
      <rect width="210" height="70" rx="8" fill="rgba(39, 39, 42, 0.8)" stroke="#52525b"/>
      <text x="16" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STORE SHOWCASE</text>
      <text x="16" y="50" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14">Curated Lookbooks</text>

      <rect x="230" y="0" width="210" height="70" rx="8" fill="rgba(39, 39, 42, 0.8)" stroke="#52525b"/>
      <text x="246" y="26" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ADMIN CONTROL</text>
      <text x="246" y="50" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="14">Dynamic Image Sync</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(40, 395)">
      <rect x="0" y="0" width="75" height="28" rx="6" fill="#27272a"/>
      <text x="12" y="19" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Next.js</text>

      <rect x="85" y="0" width="85" height="28" rx="6" fill="#27272a"/>
      <text x="97" y="19" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">React.js</text>

      <rect x="180" y="0" width="95" height="28" rx="6" fill="#27272a"/>
      <text x="192" y="19" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tailwind</text>

      <rect x="285" y="0" width="135" height="28" rx="6" fill="#27272a"/>
      <text x="297" y="19" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Catalog Engine</text>
    </g>
  </g>

  <!-- Right Visual: Store Card Mockups -->
  <g transform="translate(650, 100)">
    <!-- Store Mockup Window -->
    <rect width="470" height="475" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Mockup Header -->
    <rect width="470" height="42" rx="16" fill="#27272a"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    <text x="235" y="26" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">urbanthread-store.live</text>

    <!-- Product Card 1 -->
    <g transform="translate(30, 65)">
      <rect width="190" height="210" rx="10" fill="url(#cardGrad)"/>
      <!-- Shirt silhouette / icon -->
      <path d="M75,40 L115,40 L135,65 L120,80 L105,70 L105,150 L85,150 L85,70 L70,80 L55,65 Z" fill="#d97706" opacity="0.8"/>
      <text x="18" y="180" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Minimalist Linen</text>
      <text x="18" y="198" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">New Edition</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(250, 65)">
      <rect width="190" height="210" rx="10" fill="url(#cardGrad)"/>
      <!-- Jacket / hoodie silhouette -->
      <path d="M70,40 L120,40 L140,70 L125,85 L110,75 L110,150 L80,150 L80,75 L65,85 L50,70 Z" fill="#a1a1aa" opacity="0.8"/>
      <text x="18" y="180" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Urban Oversized</text>
      <text x="18" y="198" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Best Seller</text>
    </g>

    <!-- Bottom Store Features -->
    <g transform="translate(30, 305)">
      <rect width="410" height="135" rx="10" fill="#27272a"/>
      <text x="25" y="40" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Interactive Customer Experience</text>
      <text x="25" y="70" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">✓ Direct customer inquiries &amp; contact channels</text>
      <text x="25" y="95" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">✓ Mobile-first smooth transitions &amp; touch optimization</text>
      <text x="25" y="120" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">✓ Frictionless product browsing</text>
    </g>
  </g>
</svg>
