<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#031b2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- High-tech Radar & Satellite Elements -->
  <circle cx="850" cy="337" r="220" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  <circle cx="850" cy="337" r="160" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="850" cy="337" r="90" fill="url(#radarGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
  <circle cx="850" cy="337" r="6" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Radar sweep line -->
  <line x1="850" y1="337" x2="980" y2="200" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Satellite detected targets -->
  <circle cx="780" cy="270" r="7" fill="#ef4444" filter="url(#glow)"/>
  <circle cx="780" cy="270" r="16" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <text x="795" y="275" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SPILL DETECTED (ZONE A)</text>

  <circle cx="920" cy="420" r="5" fill="#38bdf8"/>
  <text x="932" y="424" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">AIS VESSEL #8942</text>

  <!-- Left Content Card / Dashboard Frame -->
  <g transform="translate(90, 110)">
    <!-- Glassmorphic panel -->
    <rect width="520" height="455" rx="16" fill="rgba(15, 35, 60, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>

    <!-- SIH 2026 Badge -->
    <rect x="35" y="40" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="52" cy="56" r="4" fill="#38bdf8"/>
    <text x="65" y="61" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SIH 2026 PROJECT</text>

    <!-- Title -->
    <text x="35" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">Sagar Netra</text>

    <!-- Subtitle -->
    <text x="35" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="500">
      Maritime Intelligence &amp; Oil-Spill Detection Platform
    </text>

    <!-- Telemetry Stats Cards -->
    <g transform="translate(35, 205)">
      <rect width="210" height="95" rx="10" fill="rgba(10, 25, 47, 0.7)" stroke="rgba(56, 189, 248, 0.2)"/>
      <text x="18" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">MONITORING SYSTEM</text>
      <text x="18" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Satellite Sentinel</text>
      <text x="18" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">SAR &amp; Optical Telemetry</text>
    </g>

    <g transform="translate(265, 205)">
      <rect width="210" height="95" rx="10" fill="rgba(10, 25, 47, 0.7)" stroke="rgba(56, 189, 248, 0.2)"/>
      <text x="18" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TEAM IDENTITY</text>
      <text x="18" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Straw Hat Pirates</text>
      <text x="18" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Team Leader: Tanishk Patidar</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(35, 335)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="85" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
      <text x="14" y="19" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Satellite</text>
      <!-- Pill 2 -->
      <rect x="95" y="0" width="105" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
      <text x="107" y="19" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Oil Detection</text>
      <!-- Pill 3 -->
      <rect x="210" y="0" width="80" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
      <text x="222" y="19" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AIS Data</text>
      <!-- Pill 4 -->
      <rect x="300" y="0" width="125" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)"/>
      <text x="312" y="19" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Smart Hackathon</text>
    </g>

    <text x="35" y="415" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      Qualified Internal Hackathon — DAVV Indore
    </text>
  </g>
</svg>
