<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="seoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#seoBg)"/>

  <!-- Subtle ambient glow -->
  <circle cx="1000" cy="180" r="240" fill="rgba(99, 102, 241, 0.08)"/>
  <circle cx="200" cy="500" r="180" fill="rgba(16, 185, 129, 0.06)"/>

  <!-- Left Information Card -->
  <g transform="translate(80, 95)">
    <rect width="520" height="485" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>

    <!-- Category Pill -->
    <rect x="40" y="42" width="225" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="56" y="63" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AI / SEO &amp; COMPETITOR AUDIT</text>

    <!-- Title -->
    <text x="40" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="800">Competitor SEO</text>
    <text x="40" y="165" fill="#818cf8" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Optimizer &amp; Analyzer</text>

    <!-- Description -->
    <text x="40" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="400">
      AI-powered web app analyzing and comparing websites with
    </text>
    <text x="40" y="232" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">
      actionable SEO insights, robots.txt review &amp; Gemini recommendations.
    </text>

    <!-- Key Metrics Cards -->
    <g transform="translate(40, 260)">
      <rect width="210" height="85" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#475569"/>
      <text x="18" y="28" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CONTRIBUTION</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Frontend &amp; UI</text>
      <text x="18" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Competitor Analyzer Page</text>

      <rect x="230" y="0" width="210" height="85" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#475569"/>
      <text x="248" y="28" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AI ARCHITECTURE</text>
      <text x="248" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Gemini &amp; Multi-AI</text>
      <text x="248" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Actionable SEO Insights</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(40, 375)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1e293b"/>
      <text x="14" y="19" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Next.js</text>

      <rect x="90" y="0" width="95" height="28" rx="6" fill="#1e293b"/>
      <text x="102" y="19" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TypeScript</text>

      <rect x="195" y="0" width="95" height="28" rx="6" fill="#1e293b"/>
      <text x="207" y="19" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tailwind</text>

      <rect x="300" y="0" width="135" height="28" rx="6" fill="#1e293b"/>
      <text x="312" y="19" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FastAPI &amp; Python</text>
    </g>

    <text x="40" y="445" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      Internship Project @ AntiLabs
    </text>
  </g>

  <!-- Right Visual: Comparison Dashboard Mockup -->
  <g transform="translate(640, 95)">
    <rect width="480" height="485" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="480" height="42" rx="16" fill="#1e293b"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    <text x="240" y="26" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">antilabs-seo-analyzer.app/competitor-analyzer</text>

    <!-- Side-by-side Competitor comparison bars -->
    <g transform="translate(30, 65)">
      <rect width="420" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Domain Comparison Benchmark</text>

      <!-- Target site -->
      <text x="20" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Target Website</text>
      <rect x="130" y="52" width="210" height="16" rx="4" fill="url(#indigoGrad)"/>
      <text x="350" y="65" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">92 / 100</text>

      <!-- Competitor site -->
      <text x="20" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Competitor A</text>
      <rect x="130" y="87" width="165" height="16" rx="4" fill="#475569"/>
      <text x="305" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">76 / 100</text>

      <!-- Status badges -->
      <g transform="translate(20, 120)">
        <rect width="115" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="10" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Robots.txt Valid</text>

        <rect x="125" y="0" width="125" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="135" y="14" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Sitemap Detected</text>
      </g>
    </g>

    <!-- AI Generated Recommendations Panel -->
    <g transform="translate(30, 235)">
      <rect width="420" height="215" rx="10" fill="#1e293b" stroke="#334155"/>
      <div xmlns="http://www.w3.org/1999/xhtml"></div>
      <text x="20" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AI SEO Optimization Strategy</text>
      <text x="300" y="32" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Gemini Powered</text>

      <!-- Rec Item 1 -->
      <g transform="translate(20, 50)">
        <rect width="380" height="42" rx="6" fill="#334155"/>
        <circle cx="20" cy="21" r="5" fill="#10b981"/>
        <text x="35" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Improve Semantic Heading Hierarchy</text>
        <text x="35" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Align H1 &amp; H2 tags with target high-intent search queries</text>
      </g>

      <!-- Rec Item 2 -->
      <g transform="translate(20, 102)">
        <rect width="380" height="42" rx="6" fill="#334155"/>
        <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
        <text x="35" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Core Web Vitals &amp; Meta Descriptions</text>
        <text x="35" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Optimize viewport render delay and missing OpenGraph tags</text>
      </g>

      <!-- Rec Item 3 -->
      <g transform="translate(20, 154)">
        <rect width="380" height="42" rx="6" fill="#334155"/>
        <circle cx="20" cy="21" r="5" fill="#6366f1"/>
        <text x="35" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Competitor Keyword Gap Opportunity</text>
        <text x="35" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Outranking potential identified in long-tail comparison terms</text>
      </g>
    </g>
  </g>
</svg>
