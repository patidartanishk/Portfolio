<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="tttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#tttBg)"/>
  <g transform="translate(100, 120)">
    <rect width="1000" height="435" rx="16" fill="rgba(30, 27, 75, 0.9)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.5"/>
    <rect x="50" y="45" width="150" height="32" rx="16" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1"/>
    <text x="66" y="66" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">INTERACTIVE GAME</text>
    <text x="50" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="800">Tic-Tac-Toe Interactive</text>
    <text x="50" y="175" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="20">Two-Player Game with Dynamic State &amp; Win Logic</text>
    <text x="50" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16">
      Classic strategy game built with pure JavaScript logic, handling turns, win-pattern calculation, draw state, and game resets.
    </text>
    <g transform="translate(50, 275)">
      <rect x="0" y="0" width="105" height="32" rx="6" fill="#3730a3"/>
      <text x="18" y="21" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="600">JavaScript</text>
      <rect x="120" y="0" width="95" height="32" rx="6" fill="#3730a3"/>
      <text x="135" y="21" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="600">DOM Logic</text>
      <rect x="230" y="0" width="105" height="32" rx="6" fill="#3730a3"/>
      <text x="245" y="21" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="600">CSS Styling</text>
    </g>
  </g>
  <!-- Mini Tic-Tac-Toe Grid on Right -->
  <g transform="translate(850, 230)">
    <line x1="0" y1="50" x2="150" y2="50" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="100" x2="150" y2="100" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="0" x2="50" y2="150" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="0" x2="100" y2="150" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <text x="25" y="38" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="34" font-weight="800">X</text>
    <text x="75" y="88" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">O</text>
    <text x="125" y="38" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="34" font-weight="800">X</text>
    <text x="25" y="138" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="34" font-weight="800">O</text>
    <text x="75" y="138" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="34" font-weight="800">X</text>
  </g>
</svg>
