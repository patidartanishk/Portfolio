<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#clinicBg)"/>

  <!-- Glowing tech circles -->
  <circle cx="1080" cy="180" r="180" fill="rgba(6, 182, 212, 0.08)"/>
  <circle cx="200" cy="520" r="140" fill="rgba(14, 165, 233, 0.06)"/>

  <!-- Left Information Card -->
  <g transform="translate(80, 100)">
    <rect width="520" height="475" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>

    <!-- Pill -->
    <rect x="40" y="45" width="170" height="32" rx="16" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="56" y="66" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HEALTHCARE AI WEB</text>

    <!-- Title -->
    <text x="40" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="38" font-weight="800">AI Medical Clinic</text>
    <text x="40" y="170" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Digital Health Portal</text>

    <!-- Description -->
    <text x="40" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      Next-generation digital health platform showcasing AI-assisted
    </text>
    <text x="40" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="400">
      triage workflows, doctor scheduling, and patient analytics.
    </text>

    <!-- Metrics -->
    <g transform="translate(40, 275)">
      <rect width="210" height="85" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155"/>
      <text x="18" y="28" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SMART TRIAGE</text>
      <text x="18" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Intelligent Intake</text>
      <text x="18" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Pre-consultation routing</text>

      <rect x="230" y="0" width="210" height="85" rx="8" fill="rgba(30, 41, 59, 0.7)" stroke="#334155"/>
      <text x="248" y="28" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="700">EXPERIENCE</text>
      <text x="248" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Responsive UI</text>
      <text x="248" y="73" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Accessible &amp; Intuitive</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(40, 395)">
      <rect x="0" y="0" width="75" height="28" rx="6" fill="#1e293b"/>
      <text x="12" y="19" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Next.js</text>

      <rect x="85" y="0" width="85" height="28" rx="6" fill="#1e293b"/>
      <text x="97" y="19" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600">React.js</text>

      <rect x="180" y="0" width="105" height="28" rx="6" fill="#1e293b"/>
      <text x="192" y="19" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Tailwind CSS</text>

      <rect x="295" y="0" width="125" height="28" rx="6" fill="#1e293b"/>
      <text x="307" y="19" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Health Interface</text>
    </g>
  </g>

  <!-- Right Visual: Dashboard Frame -->
  <g transform="translate(650, 100)">
    <rect width="470" height="475" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="470" height="42" rx="16" fill="#1e293b"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>
    <text x="235" y="26" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">aiclinic-care.app</text>

    <!-- Heart rate / ECG pulse wave graphic -->
    <g transform="translate(30, 65)">
      <rect width="410" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Patient Diagnostic Monitor</text>
      <!-- Pulse line -->
      <path d="M25,100 L90,100 L110,65 L130,125 L150,45 L170,110 L190,100 L385,100" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      <circle cx="150" cy="45" r="4" fill="#38bdf8"/>
      <text x="25" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Real-time health vitals telemetry stream</text>
    </g>

    <!-- Clinic Consultation Panel -->
    <g transform="translate(30, 240)">
      <rect width="410" height="200" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Virtual Consultation Room</text>
      <text x="25" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Automated preliminary symptom assessment</text>

      <g transform="translate(25, 90)">
        <rect width="170" height="45" rx="8" fill="#334155"/>
        <text x="18" y="27" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Fast Triage</text>

        <rect x="185" y="0" width="170" height="45" rx="8" fill="#334155"/>
        <text x="203" y="27" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔒 Secure Records</text>
      </g>

      <rect x="25" y="150" width="360" height="36" rx="8" fill="url(#tealGrad)"/>
      <text x="205" y="173" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Schedule Medical Appointment</text>
    </g>
  </g>
</svg>
